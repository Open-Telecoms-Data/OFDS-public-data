# OFDS Demonstration API — nginx reverse proxy snippet
#
# Include this in a server block (e.g. the ofds-demo host), or adapt as a
# standalone site. TLS termination stays on nginx.
#
# Example:
#   include /path/to/OFDS-public-data/api/deploy/nginx/ofds-api.conf;

location /api/ {
    proxy_pass http://127.0.0.1:8742;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    gzip on;
    gzip_types application/json;
    gzip_proxied any;
}
